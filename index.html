<body><main class="shell"><header><div class="mark" aria-hidden="true">SC</div><div><h1>PDM IMPORT STOCK IN</h1><p class="date" id="today"></p></div></header>
<section class="card"><form id="form"><div class="grid">
<div class="field"><label for="stockFrom">Stock From</label><input class="control upper" id="stockFrom" autocomplete="off" required placeholder="Supplier"></div>
<div class="field"><label for="container">Container No</label><input class="control upper" id="container" autocomplete="off" required placeholder="No. kontena"></div>
<div class="field"><label for="lorry">Lorry No (optional)</label><input class="control upper" id="lorry" autocomplete="off" placeholder="Lorry no"></div>
<div class="field"><label for="batch">Batch/Code No (optional)</label><input class="control upper" id="batch" autocomplete="off" placeholder="No. batch atau kod"></div></div>
<div class="section-head"><div><h2>Container Item List</h2></div><span id="count" class="hint">0 item</span></div><div class="items" id="items"></div>
<div class="actions"><button class="btn secondary" type="button" id="add">＋ Add Item</button><button class="btn primary" type="submit">Save Stock In</button></div></form></section>
<section class="summary" aria-live="polite"><div class="summary-head"><h2>Stock In Summary</h2><span id="total" class="hint"></span></div><div id="summary"><div class="empty">No Stock in Recorded.</div></div></section></main><div class="toast" id="toast" role="status"></div>
<template id="itemTemplate"><article class="item"><div class="item-head"><strong class="item-number"></strong><button class="btn remove" type="button">Remove</button></div><div class="item-grid"><div class="field wide"><label>Item Description</label><div class="item-choice"><select class="control choice"><option value="">-- Select Item --</option><option>BAWANG BESAR MERAH INDIA (AAA)</option><option>BAWANG BESAR MERAH INDIA</option><option>BAWANG BESAR MERAH CHINA</option><option>BAWANG BESAR KUNING CHINA 60/80</option><option>BAWANG BESAR HOLLAND 60/80</option><option>BAWANG BESAR KUNING NZ 60/80</option><option>BAWANG PUTIH 60/70</option><option>BAWANG PUTIH 65/70</option><option>CILI KERING INDIA (668)</option><option>CILI KERING INDIA (SCM)</option><option>CILI KERING CHINA</option><option>CILI KERING CHINA (YIDU)</option><option value="__manual">Input Manual</option></select><input class="control manual upper" type="text" placeholder="Taip nama item" aria-label="Item Description manual" hidden></div></div><div class="field"><label>KG</label><input class="control kg" type="text" inputmode="decimal" placeholder="e.g : 10 or 0.5" required><span class="bundle-info" hidden></span></div><div class="field"><label>Quantity</label><input class="control qty" type="text" inputmode="numeric" pattern="[0-9]+" placeholder="e.g: 100" required></div><div class="field wide"><label>Remarks</label><textarea class="control remarks" placeholder="(if any)"></textarea></div></div></article></template>
<dialog class="bundle-dialog" id="bundleDialog"><form class="dialog-body" method="dialog"><h2>Qty Bag / Bundle</h2><div class="field"><label for="bagsPerBundle">Bag per bundle</label><input class="control" id="bagsPerBundle" type="text" inputmode="numeric" pattern="[1-9][0-9]*" placeholder="e.g: 20" required></div><div class="dialog-actions"><button class="btn quiet" type="button" id="cancelBundle">Cancel</button><button class="btn primary" type="submit">Confirm</button></div></form></dialog><script>
(()=>{'use strict';const $=id=>document.getElementById(id), key='pdm-import-stock-in-v1';let records=[];try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))records=saved}catch{}const ids=['stockFrom','container','lorry','batch'];const caps=v=>v.trim().toUpperCase();const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=new Date();$('today').textContent=new Intl.DateTimeFormat('ms-MY',{dateStyle:'full'}).format(date);function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function renumber(){[...$('items').children].forEach((el,i)=>el.querySelector('.item-number').textContent=`Item ${i+1}`);$('count').textContent=`${$('items').children.length} item`}
function addItem(data={}){const el=$('itemTemplate').content.firstElementChild.cloneNode(true),choice=el.querySelector('.choice'),manual=el.querySelector('.manual');function toggle(){manual.hidden=choice.value!=='__manual';manual.required=!manual.hidden;if(manual.hidden)manual.value=''}choice.addEventListener('change',toggle);el.querySelector('.remove').addEventListener('click',()=>{if($('items').children.length===1){toast('Sekurang-kurangnya satu item diperlukan.');return}el.remove();renumber()});if(data.name){if([...choice.options].some(o=>o.value===data.name))choice.value=data.name;else{choice.value='__manual';manual.value=data.name}}toggle();if(data.name&&choice.value==='__manual')manual.value=data.name;el.querySelector('.kg').value=data.kg||'';el.querySelector('.qty').value=data.qty||'';el.querySelector('.remarks').value=data.remarks||'';el.dataset.bundle=data.bundle||'';const kgInput=el.querySelector('.kg');kgInput.addEventListener('input',()=>{if(Number(kgInput.value.replace(',','.'))>1){el.dataset.bundle='';el.querySelector('.bundle-info').hidden=true}else if(el.dataset.bundle){el.querySelector('.bundle-info').hidden=false}});if(data.bundle){const info=el.querySelector('.bundle-info');info.textContent=`1 × ${data.bundle} bag / bundle`;info.hidden=false}$('items').append(el);renumber();return el}
function render(){const host=$('summary');$('total').textContent=`${records.length} stock in`;if(!records.length){host.innerHTML='<div class="empty">Belum ada stock in disimpan.</div>';return}host.innerHTML=records.map((r,ri)=>`<section class="card" style="margin-bottom:14px"><div class="summary-head"><h2>Stock In ${records.length-ri}</h2><span class="note">${escape(r.date)}</span></div><dl class="details"><div><dt>Stock From</dt><dd>${escape(r.stockFrom)}</dd></div><div><dt>Container No</dt><dd>${escape(r.container)}</dd></div><div><dt>Lorry No</dt><dd>${escape(r.lorry||'—')}</dd></div><div><dt>Batch/Code No</dt><dd>${escape(r.batch||'—')}</dd></div></dl><div class="table-wrap"><table><thead><tr><th>Item Description</th><th>KG</th><th>Quantity</th><th>Remarks</th></tr></thead><tbody>${r.items.map(x=>`<tr><td class="name" data-label="Item">${escape(x.name)}${x.bundle?' (1 × '+escape(x.bundle)+')':''}</td><td data-label="KG">${escape(x.kg)}</td><td data-label="Quantity">${escape(x.qty)}${x.bundle?' BDL':''}</td><td data-label="Remarks">${escape(x.remarks||'—')}</td></tr>`).join('')}</tbody></table></div><div class="summary-actions"><button type="button" class="btn print" data-print="${ri}">Print PDF</button><button type="button" class="btn clear" data-clear="${ri}">Clear Stock In</button></div></section>`).join('')}
function askBundle(el){return new Promise(resolve=>{const dialog=$('bundleDialog'),input=$('bagsPerBundle');input.value=el.dataset.bundle||'';let done=false;function finish(value){if(done)return;done=true;dialog.removeEventListener('close',closed);$('cancelBundle').removeEventListener('click',cancel);dialog.querySelector('form').removeEventListener('submit',confirm);if(dialog.open)dialog.close();resolve(value)}function closed(){finish(null)}function cancel(){finish(null)}function confirm(e){e.preventDefault();if(!/^[1-9]\d*$/.test(input.value.trim())){input.focus();return}finish(input.value.trim())}dialog.addEventListener('close',closed);$('cancelBundle').addEventListener('click',cancel);dialog.querySelector('form').addEventListener('submit',confirm);dialog.showModal();input.focus()})}async function ensureBundle(el){const kg=Number(el.querySelector('.kg').value.trim().replace(',','.'));if(!(kg>0&&kg<=1))return true;if(el.dataset.bundle)return true;const count=await askBundle(el);if(!count)return false;el.dataset.bundle=count;const info=el.querySelector('.bundle-info');info.textContent=`1 × ${count} bag / bundle`;info.hidden=false;return true}function printStockIn(r){const popup=window.open('','_blank');if(!popup){toast('Sila benarkan pop-up untuk Print PDF.');return}const line=(label,value='')=>`<div class="line"><span class="label">${label}</span><span>:</span><span class="value">${escape(value)}</span></div>`;const rows=r.items.map(x=>`<tr><td>${escape(x.name)}${x.bundle?' (1 × '+escape(x.bundle)+')':''}</td><td>${escape(x.kg)}</td><td>${escape(x.qty)}${x.bundle?' BDL':''}</td></tr>`).join('')+'<tr><td></td><td></td><td></td></tr>'.repeat(Math.max(0,5-r.items.length));const remarkRows=r.items.filter(x=>x.remarks).map(x=>`<div class="remark-row"><strong>${escape(x.name)}${x.bundle?' (1 × '+escape(x.bundle)+')':''} &nbsp; ${escape(x.kg)} KG</strong><span> : </span><em>${escape(x.remarks)}</em></div>`).join('');const remarksLine=`<div class="line remark-line"><span class="label">REMARKS</span><span>:</span><div class="value remarks-value">${remarkRows}</div></div>`;const html=`<!doctype html><html><head><meta charset="utf-8"><title>PDM IMPORT STOCK IN - ${escape(r.container)}</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:10pt}.page{width:210mm;min-height:297mm;padding:23mm 18mm 17mm;margin:auto}.heading{display:flex;align-items:center;gap:25mm;margin-bottom:27mm}.heading img{width:29mm;height:29mm;object-fit:contain}.heading h1{font-size:19pt;margin:0;white-space:nowrap}.line{display:grid;grid-template-columns:38mm 5mm 1fr;align-items:end;min-height:9mm;gap:0}.label{white-space:nowrap}.line .label,.line>span:nth-child(2){padding-bottom:1mm;line-height:1.25}.value{border-bottom:1px solid #000;padding:0 2mm 1mm;line-height:1.25;overflow-wrap:anywhere}.table{width:100%;border-collapse:collapse;margin:14mm 0 10mm;table-layout:fixed}.table th,.table td{border:1px solid #000;padding:2mm 2.5mm;min-height:7mm;height:7mm;vertical-align:middle}.table th{font-size:10pt;text-align:center}.table th:nth-child(1){width:55%}.table th:nth-child(2){width:19%}.table th:nth-child(3){width:26%}.table td:nth-child(n+2){text-align:center}.remark-line{align-items:start;margin-top:2mm}.remark-line .label,.remark-line>span:nth-child(2){padding-top:1mm}.remarks-value{min-height:7mm;padding-top:1mm}.remark-row{line-height:1.45;overflow-wrap:anywhere;padding-bottom:1mm}.remark-row em{font-style:italic;font-weight:400}.bottom{margin-top:7mm}.grn{margin-top:17mm}@media print{.page{margin:0}.table tr{break-inside:avoid}}@media screen{body{background:#ddd}.page{background:#fff;box-shadow:0 5px 25px #0002;margin:15px auto}}</style></head><body><div class="page"><div class="heading"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5OjcBCgoKDQwNGg8PGjclHyU3Nzc3Nzc3Nzc3Nzc3Nzc3Nz
